<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <title>Weather Dashboard</title>
  <style>
    /* Critical CSS - Prevent FOUC */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background-color: #f7fafc;
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }

    body.loaded {
      opacity: 1;
    }

    body.dark-mode {
      background-color: #1a202c;
    }

    /* Preloader */
    .preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #4a90e2 0%, #667eea 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
    }

    .preloader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .preloader-icon {
      font-size: 4rem;
      color: white;
      animation: float 2s ease-in-out infinite;
    }

    .preloader-text {
      margin-top: 1.5rem;
      font-size: 1.25rem;
      color: white;
      font-weight: 600;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-20px);
      }
    }
  </style>
</head>

<body>
  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <i class="fas fa-cloud-sun preloader-icon"></i>
    <div class="preloader-text">Loading Weather Dashboard...</div>
  </div>

  <!-- Header -->
  <header class="weather-header">
    <div class="header-content">
      <div class="header-left">
        <i class="fas fa-cloud-sun header-icon"></i>
        <h1 class="header-title">Weather Dashboard</h1>
      </div>
      <div class="header-controls">
        <button id="unit-toggle" class="control-btn" title="Toggle Temperature Unit"
          aria-label="Toggle temperature unit">
          <i class="fas fa-thermometer-half"></i>
          <span class="unit-text">°C</span>
        </button>
        <button id="dark-mode-toggle" class="control-btn" title="Toggle Dark Mode" aria-label="Toggle dark mode">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    <div class="content-wrapper">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="search-section">
          <h2 class="search-title">
            <i class="fas fa-search"></i>
            Search for a City
          </h2>
          <form id="search-form" class="search-form">
            <div class="input-wrapper">
              <input class="search-input" type="text" id="search-input" placeholder="Enter city name..."
                aria-label="City name" autocomplete="off" />
              <button type="button" class="clear-btn" id="clear-button" aria-label="Clear" style="display: none;">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </form>
        </div>

        <div class="history-section">
          <h3 class="history-title">
            <i class="fas fa-history"></i>
            Recent Searches
          </h3>
          <div class="history-list" id="history"></div>
        </div>
      </aside>

      <!-- Main Weather Display -->
      <div class="weather-content">
        <!-- Current Weather Card -->
        <section class="current-weather-card" role="region" aria-live="polite">
          <div id="today" class="current-weather-body">
            <div class="weather-header-section">
              <h2 class="city-title" id="search-title">
                <i class="fas fa-map-marker-alt"></i>
                Search for a city to get started
              </h2>
              <img id="weather-img" class="weather-icon-large" alt="Weather icon" src="" style="display: none;">
            </div>
            <div class="weather-stats">
              <div class="stat-card">
                <i class="fas fa-temperature-high stat-icon"></i>
                <div class="stat-content">
                  <span class="stat-label">Temperature</span>
                  <span class="stat-value" id="temp">--°F</span>
                </div>
              </div>
              <div class="stat-card">
                <i class="fas fa-wind stat-icon"></i>
                <div class="stat-content">
                  <span class="stat-label">Wind Speed</span>
                  <span class="stat-value" id="wind">-- MPH</span>
                </div>
              </div>
              <div class="stat-card">
                <i class="fas fa-tint stat-icon"></i>
                <div class="stat-content">
                  <span class="stat-label">Humidity</span>
                  <span class="stat-value" id="humidity">-- %</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 5-Day Forecast -->
        <section class="forecast-section" role="region" aria-live="polite">
          <h3 class="forecast-title">
            <i class="fas fa-calendar-week"></i>
            5-Day Forecast
          </h3>
          <div id="forecast" class="forecast-grid"></div>
        </section>

        <!-- Weather Map Section -->
        <section class="map-section">
          <div class="map-container">
            <div class="map-header">
              <i class="fas fa-map-marked-alt map-icon"></i>
            </div>
            <div id="weather-map" class="weather-map"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // Remove preloader and show content when page is fully loaded
    window.addEventListener('DOMContentLoaded', () => {
      // Check for saved dark mode preference
      const isDarkMode = localStorage.getItem('darkMode') === 'true';
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
      }

      // Small delay to ensure fonts are loaded
      setTimeout(() => {
        document.body.classList.add('loaded');
        document.getElementById('preloader').classList.add('hidden');
      }, 100);
    });
  </script>
</body>

</html>
